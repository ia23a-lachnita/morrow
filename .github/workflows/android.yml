name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build the app shell
        run: npm run build:mobile

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Add the Android project
        run: npx cap add android

      - name: Theme and notification permission
        run: node scripts/patch-android.mjs

      - name: Copy the web build in
        run: npx cap sync android

      - name: Assemble a debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk morrow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morrow-apk
          path: morrow.apk
          if-no-files-found: error

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Morrow ${{ github.run_number }}
          prerelease: true
          make_latest: true
          files: morrow.apk
          body: |
            Sideload build of Morrow. Allow installs from unknown sources, then open morrow.apk.
            Signed with the debug key. Not a Play Store release.
